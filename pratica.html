<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon4.png">
    <title>@dicarvalho.prof | Atividades</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mars: {
                            rubi: '#c20000',
                            bg: '#000000',
                            card: '#0a0a0a',
                            border: '#1a1a1a',
                            hover: '#141414'
                        },
                        rose: {
                            400: '#ff4081',
                            500: '#e91e63',
                            600: '#c2185b',
                            900: '#4a0c1e'
                        }
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        :root {
            --mars-rubi: #c20000;
            --mars-bg: #000000;
            --mars-card: #0a0a0a;
            --mars-border: #1a1a1a;
            --mars-glow: rgba(194, 0, 0, 0.25);
            --mars-glow-hover: rgba(194, 0, 0, 0.55);
            --rose-500: #e91e63;
            --rose-400: #ff4081;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Glassmorphic Container */
        .glass-panel {
            background: rgb(10, 10, 10);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--mars-border);
        }

        /* Dynamic Card Glows */
        .link-card {
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border: 1px solid var(--mars-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px var(--mars-glow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (hover: hover) {
            .link-card:hover {
                border-color: var(--mars-rubi);
                transform: translateY(-4px);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8), 0 0 22px var(--mars-glow-hover);
            }
        }

        .link-card:active {
            transform: scale(0.96);
            border-color: var(--mars-rubi);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--mars-rubi);
        }

        /* Remove scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Search input - COM A IMAGEM DE FUNDO MANTIDA */
        .search-input {

            background-size: cover;
            background-position: center;
            background-color: #0a0a0a; /* fallback */
            transition: all 0.3s ease;
            position: relative;
        }

        body {
            background-image: 
            linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            url('wallpaper.png');
    background-size: cover;
    background-position: center;
    background-color: #0a0a0a;
    background-attachment: fixed;
}

        /* Hover - mantém a imagem, só adiciona glow */
        .search-input:hover {
            border-color: rgba(194, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(194, 0, 0, 0.15);
        }

        /* Focus - NÃO remove a imagem, apenas adiciona o glow vermelho */
        .search-input:focus {
            border-color: #c20000;
            box-shadow: 0 0 25px rgba(194, 0, 0, 0.25), inset 0 0 20px rgba(194, 0, 0, 0.05);
            outline: none;
            /* A imagem permanece! */
        }

        /* Remove o flash branco do autofill */
        .search-input:-webkit-autofill,
        .search-input:-webkit-autofill:hover,
        .search-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px #0a0a0a inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Lazy Load Animation */
        .lazy-load {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .lazy-load-delay-1 { animation-delay: 0.1s; }
        .lazy-load-delay-2 { animation-delay: 0.2s; }
        .lazy-load-delay-3 { animation-delay: 0.3s; }
        .lazy-load-delay-4 { animation-delay: 0.4s; }
        .lazy-load-delay-5 { animation-delay: 0.5s; }
        .lazy-load-delay-6 { animation-delay: 0.6s; }
        .lazy-load-delay-7 { animation-delay: 0.7s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stagger children animation */
        .stagger-children > * {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.5s ease forwards;
        }

        .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
        .stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
        .stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
        .stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
        .stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
        .stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
        .stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
        .stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
        .stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
        .stagger-children > *:nth-child(10) { animation-delay: 0.5s; }
        .stagger-children > *:nth-child(11) { animation-delay: 0.55s; }
        .stagger-children > *:nth-child(12) { animation-delay: 0.6s; }
    </style>
</head>
<body class="min-h-screen bg-black text-white antialiased">
        <div id="root"></div>

    <script type="text/babel">
        const ACTIVITIES_DATA = [
            
            {
                id: 'roleplay',
                title: 'Role play',
                subtitle: 'Simule uma conversa em Inglês em diferentes situações.',
                icon: 'fa-microphone-lines',
                url: 'https://dididoingles.github.io/roleplay/',
                category: 'speaking',
                desktopOnly: false
            },
            {
                id: 'tempos-verbais',
                title: 'Tempos verbais',
                subtitle: 'Treine suas habilidades no present, past and future.',
                icon: 'fa-microscope',
                url: 'https://dididoingles.github.io/Storychallenge/',
                category: 'grammar',
                desktopOnly: false
            },
            {
                id: 'leitor',
                title: 'Leitor de textos (TTS)',
                subtitle: 'Insira seu texto e ouça a pronúncia correta.',
                icon: 'fa-robot',
                url: 'https://dididoingles.github.io/leitor/',
                category: 'tools',
                desktopOnly: false
            },
            {
                id: 'youlisten',
                title: 'YouListen',
                subtitle: 'Pratique sua compreensão com vídeos curtinhos do YouTube.',
                icon: 'fa-youtube',
                isBrandIcon: true,
                url: 'https://dididoingles.github.io/youlisten/',
                category: 'listening',
                desktopOnly: false
            },
            {
                id: 'couples-trivia',
                title: 'Você me conhece?',
                subtitle: 'Versão em Inglês do famoso "Perguntados" para casais.',
                icon: 'fa-user-group',
                url: 'https://dididoingles.github.io/couples_trivia/',
                category: 'games',
                desktopOnly: false
            },
            {
                id: 'airpaint',
                title: 'Airpaint Beta',
                subtitle: 'Desenhe usando gestos das mãos via webcam.',
                icon: 'fa-wand-magic-sparkles',
                url: 'https://dididoingles.github.io/airpaint/',
                category: 'tools',
                desktopOnly: true,
                warningText: 'Aviso: não funciona em mobile.'
            },
            {
                id: 'whiteboard',
                title: 'Whiteboard',
                subtitle: 'Quadro interativo para anotações e desenhos.',
                icon: 'fa-chalkboard',
                url: 'https://dididoingles.github.io/whiteboard-2.0/',
                category: 'tools',
                desktopOnly: true,
                warningText: 'Aviso: não funciona em dispositivos móveis.'
            }
            
        ];

        const App = () => {
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('all');
            const [favorites, setFavorites] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('dicarvalho_favs');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });
            const [isInstagramBrowser, setIsInstagramBrowser] = React.useState(false);
            const [copied, setCopied] = React.useState(false);
            const [viewMode, setViewMode] = React.useState('grid');
            const [toastMessage, setToastMessage] = React.useState(null);
            const [isLoaded, setIsLoaded] = React.useState(false);

            // Check if inside Instagram/FB webview
            React.useEffect(() => {
                const ua = navigator.userAgent || navigator.vendor || window.opera;
                const isIG = (ua.indexOf("Instagram") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1);
                setIsInstagramBrowser(isIG);
                
                // Trigger lazy load animation after component mounts
                setIsLoaded(true);
            }, []);

            // Save favorites to localStorage
            const toggleFavorite = (e, id) => {
                e.preventDefault();
                e.stopPropagation();
                let updated;
                if (favorites.includes(id)) {
                    updated = favorites.filter(favId => favId !== id);
                    showToast('Removido dos favoritos');
                } else {
                    updated = [...favorites, id];
                    showToast('Adicionado aos favoritos!');
                }
                setFavorites(updated);
                try {
                    localStorage.setItem('dicarvalho_favs', JSON.stringify(updated));
                } catch (err) {
                    console.error("Storage error:", err);
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage(null);
                }, 2200);
            };

            const copyPageUrl = () => {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                setCopied(true);
                showToast('Link copiado! Abra no Chrome ou Safari.');
                setTimeout(() => setCopied(false), 3000);
            };

            const filteredActivities = ACTIVITIES_DATA.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.subtitle.toLowerCase().includes(searchQuery.toLowerCase());
                
                if (!matchesSearch) return false;
                if (activeTab === 'mobile') return !item.desktopOnly;
                if (activeTab === 'desktop') return item.desktopOnly;
                if (activeTab === 'favorites') return favorites.includes(item.id);
                
                return true;
            });

            return (
                <div class={`relative z-10 min-h-screen max-w-4xl mx-auto px-4 py-6 md:py-10 flex flex-col justify-between transition-opacity duration-700 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}>
                    
                    {/* Header Section - with 50px top margin */}
                    <div class="pt-[50px] sm:pt-[60px] md:pt-[70px]">
                        {/* Main Title & Subtitle */}
                        <div class="text-center mb-8 lazy-load lazy-load-delay-1">
                            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight mb-2">
                                Pick your <span class="text-[#c20000] drop-shadow-[0_0_12px_rgba(194,0,0,0.6)]">tool</span>
                            </h1>
                            <p class="text-neutral-400 text-xs sm:text-sm font-light max-w-lg mx-auto leading-relaxed">
                                Escolha uma ferramenta para iniciar sua prática de inglês. 
                            </p>
                        </div>

                        {/* In-App Instagram Warning Banner */}
                        {isInstagramBrowser && (
                            <div class="mb-6 p-3.5 rounded-2xl bg-red-950/40 border border-red-600/40 flex items-start gap-3 text-xs text-neutral-200 backdrop-blur-md shadow-lg lazy-load lazy-load-delay-2">
                                <i class="fa-solid fa-triangle-exclamation text-red-500 text-lg shrink-0 mt-0.5"></i>
                                <div class="flex-1">
                                    <p class="font-semibold text-white mb-0.5">Aviso de Navegador Interno</p>
                                    <p class="text-neutral-300 text-[11px] leading-relaxed mb-2">
                                        O navegador do Instagram pode bloquear o microfone, áudio ou gestos. Abra no navegador padrão para uma experiência completa.
                                    </p>
                                    <button 
                                        onClick={copyPageUrl}
                                        class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium text-[11px] flex items-center gap-1.5 transition-colors shadow-md"
                                    >
                                        <i class={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                                        {copied ? 'Link Copiado!' : 'Copiar Link para Navegador'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Controls Toolbar: Search, Filters & View Toggle */}
                        <div class="space-y-4 mb-8 lazy-load lazy-load-delay-3">
                            {/* Search bar - COM A IMAGEM DE FUNDO */}
                            <div class="relative w-full max-w-md mx-auto group">
                                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-500 text-xs z-10"></i>
                                <input 
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Buscar atividade ou recurso..."
                                    class="search-input w-full border border-[#1a1a1a] rounded-xl pl-9 pr-8 py-2.5 text-xs text-white placeholder-neutral-500 transition-all shadow-inner"
                                />
                                {searchQuery && (
                                    <button 
                                        onClick={() => setSearchQuery('')}
                                        class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-white z-10"
                                    >
                                        <i class="fa-solid fa-xmark text-xs"></i>
                                    </button>
                                )}
                            </div>

                            {/* Category Tabs & View Layout Toggle */}
                            <div class="flex flex-wrap items-center justify-between gap-2 max-w-lg mx-auto">
                                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
                                    <button 
                                        onClick={() => setActiveTab('all')}
                                        class={`px-3 py-1.5 rounded-lg font-medium transition-all whitespace-nowrap ${
                                            activeTab === 'all' 
                                                ? 'bg-[#c20000] text-white shadow-md shadow-red-950/50' 
                                                : 'bg-[#0a0a0a] border border-[#1a1a1a] text-neutral-400 hover:text-white'
                                        }`}
                                    >
                                        Tudo ({ACTIVITIES_DATA.length})
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('mobile')}
                                        class={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 whitespace-nowrap ${
                                            activeTab === 'mobile' 
                                                ? 'bg-[#c20000] text-white shadow-md shadow-red-950/50' 
                                                : 'bg-[#0a0a0a] border border-[#1a1a1a] text-neutral-400 hover:text-white'
                                        }`}
                                    >
                                        <i class="fa-solid fa-mobile-screen text-[10px]"></i>
                                        Mobile
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('desktop')}
                                        class={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 whitespace-nowrap ${
                                            activeTab === 'desktop' 
                                                ? 'bg-[#c20000] text-white shadow-md shadow-red-950/50' 
                                                : 'bg-[#0a0a0a] border border-[#1a1a1a] text-neutral-400 hover:text-white'
                                        }`}
                                    >
                                        <i class="fa-solid fa-desktop text-[10px]"></i>
                                        Desktop
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('favorites')}
                                        class={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1.5 whitespace-nowrap ${
                                            activeTab === 'favorites' 
                                                ? 'bg-[#c20000] text-white shadow-md shadow-red-950/50' 
                                                : 'bg-[#0a0a0a] border border-[#1a1a1a] text-neutral-400 hover:text-white'
                                        }`}
                                    >
                                        <i class="fa-solid fa-star text-amber-400 text-[10px]"></i>
                                        Fav ({favorites.length})
                                    </button>
                                </div>

                                {/* Grid vs List Mode Buttons */}
                                <div class="flex items-center bg-[#0a0a0a] border border-[#1a1a1a] rounded-lg p-0.5">
                                    <button 
                                        onClick={() => setViewMode('grid')}
                                        class={`px-2 py-1 rounded text-xs transition-colors ${viewMode === 'grid' ? 'bg-[#1a1a1a] text-white' : 'text-neutral-500 hover:text-white'}`}
                                        title="Visão em Grade"
                                    >
                                        <i class="fa-solid fa-grip"></i>
                                    </button>
                                    <button 
                                        onClick={() => setViewMode('list')}
                                        class={`px-2 py-1 rounded text-xs transition-colors ${viewMode === 'list' ? 'bg-[#1a1a1a] text-white' : 'text-neutral-500 hover:text-white'}`}
                                        title="Visão em Lista"
                                    >
                                        <i class="fa-solid fa-list"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Activities Cards Grid with stagger animation */}
                        {filteredActivities.length === 0 ? (
                            <div class="text-center py-12 border border-dashed border-neutral-800 rounded-2xl max-w-md mx-auto lazy-load lazy-load-delay-4">
                                <i class="fa-solid fa-ghost text-3xl text-neutral-600 mb-3"></i>
                                <p class="text-sm font-medium text-neutral-300">Nenhuma atividade encontrada</p>
                                <p class="text-xs text-neutral-500 mt-1">Tente mudar sua busca ou filtro ativado.</p>
                                <button 
                                    onClick={() => { setSearchQuery(''); setActiveTab('all'); }}
                                    class="mt-4 px-3 py-1.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-red-500 hover:text-red-400"
                                >
                                    Limpar Filtros
                                </button>
                            </div>
                        ) : (
                            <div class={
                                viewMode === 'grid' 
                                    ? "grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-3.5 sm:gap-4 max-w-4xl mx-auto stagger-children"
                                    : "flex flex-col gap-3 max-w-2xl mx-auto stagger-children"
                            }>
                                {filteredActivities.map((item) => {
                                    const isFav = favorites.includes(item.id);
                                    
                                    if (viewMode === 'list') {
                                        return (
                                            <a 
                                                key={item.id}
                                                href={item.url}
                                                rel="noopener noreferrer"
                                                class="link-card p-4 rounded-xl flex items-center gap-4 relative group"
                                            >
                                                {/* Icon - #c20000 */}
                                                <div class="shrink-0 text-[#c20000] text-xl group-hover:scale-110 transition-transform">
                                                    <i class={`${item.isBrandIcon ? 'fa-brands' : 'fa-solid'} ${item.icon}`}></i>
                                                </div>

                                                {/* Content */}
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex items-center gap-2">
                                                        <h3 class="font-semibold text-sm text-white group-hover:text-red-500 transition-colors truncate">
                                                            {item.title}
                                                        </h3>
                                                        {item.desktopOnly ? (
                                                            <span class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-rose-900/60 text-rose-400 border border-rose-800/50 shrink-0">
                                                                Desktop
                                                            </span>
                                                        ) : (
                                                            <span class="px-1.5 py-0.5 rounded text-[9px] font-medium bg-rose-900/40 text-rose-300 border border-rose-800/30 shrink-0">
                                                                Mobile
                                                            </span>
                                                        )}
                                                    </div>
                                                    <p class="text-[11px] text-neutral-400 font-light truncate mt-0.5">
                                                        {item.subtitle}
                                                    </p>
                                                    {item.warningText && (
                                                        <span class="text-[10px] text-amber-500/90 font-medium block mt-0.5">
                                                            {item.warningText}
                                                        </span>
                                                    )}
                                                </div>

                                                {/* Actions */}
                                                <div class="flex items-center gap-2 shrink-0">
                                                    <button 
                                                        onClick={(e) => toggleFavorite(e, item.id)}
                                                        class="p-2 text-neutral-600 hover:text-amber-400 transition-colors"
                                                        title="Favoritar"
                                                    >
                                                        <i class={`fa-solid fa-star ${isFav ? 'text-amber-400' : ''}`}></i>
                                                    </button>
                                                    <i class="fa-solid fa-chevron-right text-xs text-neutral-600 group-hover:text-red-500 group-hover:translate-x-0.5 transition-all"></i>
                                                </div>
                                            </a>
                                        );
                                    }

                                    /* Default Grid Card - SEM linha e SEM "Acessar" */
                                    return (
                                        <a 
                                            key={item.id}
                                            href={item.url}
                                            rel="noopener noreferrer"
                                            class="link-card aspect-square rounded-2xl p-3.5 sm:p-4 flex flex-col items-center justify-between text-center relative group overflow-hidden"
                                        >
                                            {/* Top Card Badge / Favorite Star */}
                                            <div class="w-full flex items-center justify-between text-[10px] text-neutral-500">
                                                <span>
                                                    {item.desktopOnly ? (
                                                        <span class="inline-flex items-center gap-1 text-rose-400 font-medium bg-rose-900/30 px-1.5 py-0.5 rounded border border-rose-800/40">
                                                            <i class="fa-solid fa-desktop text-[8px]"></i> Desktop
                                                        </span>
                                                    ) : (
                                                        <span class="inline-flex items-center gap-1 text-rose-300 font-medium bg-rose-900/20 px-1.5 py-0.5 rounded border border-rose-800/30">
                                                            <i class="fa-solid fa-mobile-screen text-[8px]"></i> Mobile
                                                        </span>
                                                    )}
                                                </span>
                                                <button 
                                                    onClick={(e) => toggleFavorite(e, item.id)}
                                                    class="p-1 hover:scale-125 transition-transform"
                                                    title={isFav ? "Remover dos Favoritos" : "Adicionar aos Favoritos"}
                                                >
                                                    <i class={`fa-solid fa-star text-xs ${isFav ? 'text-amber-400 drop-shadow-[0_0_6px_rgba(251,191,36,0.6)]' : 'text-neutral-700 hover:text-neutral-400'}`}></i>
                                                </button>
                                            </div>

                                            {/* Center Icon - #c20000 */}
                                            <div class="my-auto flex flex-col items-center">
                                                <div class="text-[#c20000] text-3xl mb-2.5 group-hover:scale-110 group-hover:text-[#c20000] transition-all drop-shadow-[0_0_8px_rgba(194,0,0,0.3)]">
                                                    <i class={`${item.isBrandIcon ? 'fa-brands' : 'fa-solid'} ${item.icon}`}></i>
                                                </div>

                                                <h2 class="font-semibold text-xs sm:text-sm text-white leading-tight group-hover:text-red-500 transition-colors">
                                                    {item.title}
                                                </h2>

                                                <p class="text-[10px] text-neutral-400 font-light line-clamp-2 leading-tight mt-1 px-1">
                                                    {item.subtitle}
                                                </p>
                                            </div>

                                            {/* Bottom - SEM LINHA, apenas o warning quando existir */}
                                            {item.warningText && (
                                                <div class="w-full pt-1">
                                                    <span class="text-rose-400/90 font-medium text-[9px] truncate block">
                                                        {item.warningText}
                                                    </span>
                                                </div>
                                            )}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* Footer Section */}
                    <footer class="mt-12 pt-6 border-t border-neutral-900 flex flex-col items-center text-center lazy-load lazy-load-delay-5">
                        <div class="flex items-center gap-6 mb-6">
                            <a 
                                href="https://www.instagram.com/dicarvalho.prof/" 
                                rel="noopener noreferrer"
                                class="w-11 h-11 rounded-full bg-[#0a0a0a] border border-[#1a1a1a] flex items-center justify-center text-neutral-400 hover:text-[#c20000] hover:border-[#c20000] hover:scale-110 hover:shadow-[0_0_15px_rgba(194,0,0,0.4)] transition-all"
                                title="Instagram"
                            >
                                <i class="fa-brands fa-instagram text-xl"></i>
                            </a>

                            <a 
                                href="https://www.youtube.com/@Diandraprof" 
                                rel="noopener noreferrer"
                                class="w-11 h-11 rounded-full bg-[#0a0a0a] border border-[#1a1a1a] flex items-center justify-center text-neutral-400 hover:text-[#c20000] hover:border-[#c20000] hover:scale-110 hover:shadow-[0_0_15px_rgba(194,0,0,0.4)] transition-all"
                                title="YouTube"
                            >
                                <i class="fa-brands fa-youtube text-xl"></i>
                            </a>

                            <a 
                                href="https://wa.me/5516993272278" 
                                rel="noopener noreferrer"
                                class="w-11 h-11 rounded-full bg-[#0a0a0a] border border-[#1a1a1a] flex items-center justify-center text-neutral-400 hover:text-[#c20000] hover:border-[#c20000] hover:scale-110 hover:shadow-[0_0_15px_rgba(194,0,0,0.4)] transition-all"
                                title="WhatsApp"
                            >
                                <i class="fa-brands fa-whatsapp text-xl"></i>
                            </a>
                        </div>

                        <div class="tracking-[0.25em] text-[10px] uppercase font-medium text-neutral-500 mb-1">
                            Education of the Future
                        </div>
                        <p class="text-[10px] text-neutral-600 font-light">
                            © {new Date().getFullYear()} @dicarvalho.prof. Todos os direitos reservados.
                        </p>
                    </footer>

                    {/* Toast Alert Notification */}
                    {toastMessage && (
                        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#141414] border border-[#c20000]/60 px-4 py-2 rounded-xl text-xs text-white shadow-2xl flex items-center gap-2 animate-bounce">
                            <i class="fa-solid fa-circle-info text-[#c20000]"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
