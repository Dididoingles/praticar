<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon4.png">
    <title>Loader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 12vh;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-image: 
            linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            url('wallpaper.png');
    background-size: cover;
    background-position: center;
    background-color: #0a0a0a;
    background-attachment: fixed;
    transition: background-image 0.5s ease-in-out;
    image-rendering: auto;
}

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 700px;
            width: 90%;
        }

        .title {
            color: #ffffff;
            font-size: 50px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.1s forwards;
            line-height: 1.3;
            margin-top: 50px;
        }

        .title .highlight {
            color: #c20000;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            font-weight: 300;
            text-align: center;
            line-height: 1.3;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.2s forwards;
            max-width: 550px;
            word-break: normal;
    overflow-wrap: normal;
    hyphens: none;
    margin-top: 50px;
        }

        .subtitle-secondary {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            font-weight: 300;
            text-align: center;
            line-height: 1.3;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.3s forwards;
            max-width: 550px;
            word-break: break-word;
            hyphens: auto;
        }


        #lottie-loader {
            width: 300px;
            height: 300px;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            transform-origin: center;
            opacity: 0;
            transform: scale(0.3) rotate(-180deg);
            margin: 8px 0 4px 0;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-180deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.1) rotate(5deg);
            }
            80% {
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .btn-continuar {
            background: transparent;
            color: #c20000;
            border: 2px solid #c20000;
            padding: 8px 48px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.5s forwards;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .btn-continuar i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .btn-continuar:hover {
            background: #c20000;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(194, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .btn-continuar:hover i {
            transform: translateX(5px);
        }

        .btn-continuar:active {
            transform: translateY(0px) scale(0.98);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding-top: 5vh;
            }

            .content {
                gap: 10px;
            }

            #lottie-loader {
                width: 200px;
                height: 200px;
                margin: 4px 0 2px 0;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
                max-width: 100%;
            }

            .subtitle-secondary {
                font-size: 9px;
                max-width: 100%;
            }
            .subtitle-third {
                font-size: 8px;
                margin-top: 6px;
                color:#ffffff;
            }

            .btn-continuar {
                padding: 6px 32px;
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding-top: 4vh;
            }

            #lottie-loader {
                width: 180px;
                height: 180px;
                margin-top: 50px;
            }

            .title {
                font-size: 23px;
                margin-top: 20px;
            }

            .subtitle {
                font-size: 15px;
                margin-top: 100px;
            }

            .subtitle-secondary {
                font-size: 8px;
            }

            .subtitle-third {
                font-size: 8px;
                margin-top: 2px;
                color:#ffffff;
            }

            .btn-continuar {
                padding: 6px 25px;
                font-size: 13px;
                gap: 8px;
            }

            .btn-continuar i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        
        <p class="subtitle">Bem vindo ao nosso ambiente de pratica de Inglês. Não tem anúncios. É tudo gratuito.</p>
        <p class="subtitle-secondary">@dicarvalho.prof</p>
        <div id="lottie-loader"></div>
        
        <a href="pratica.html" class="btn-continuar">
            <span>Continuar</span>
            <i class="fas fa-arrow-right"></i>
        </a>
        <p class="subtitle-third">
            Nota: funciona melhor no computador.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loaderContainer = document.getElementById('lottie-loader');

            try {
                if (typeof lottie === 'undefined') {
                    throw new Error('Biblioteca Lottie nao carregada');
                }

                const animation = lottie.loadAnimation({
                    container: loaderContainer,
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: 'Loader.json',
                    rendererSettings: {
                        preserveAspectRatio: 'xMidYMid slice',
                        clearCanvas: true,
                        progressiveLoad: true,
                        hideOnTransparent: true
                    }
                });

                animation.addEventListener('DOMLoaded', function() {
                    console.log('Loader carregado com sucesso');
                });

                animation.addEventListener('error', function(err) {
                    console.error('Erro ao carregar animacao:', err);
                });

            } catch (error) {
                console.error('Erro:', error.message);
            }

            fetch('Loader.json')
                .then(response => {
                    if (!response.ok) {
                        console.warn('Arquivo Loader.json nao encontrado');
                    } else {
                        console.log('Arquivo Loader.json encontrado');
                    }
                })
                .catch(() => {
                    console.warn('Nao foi possivel verificar o arquivo Loader.json');
                });
        });
    </script>
</body>
</html>
